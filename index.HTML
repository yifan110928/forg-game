<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数独 · 三关卡</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #f2eee9 0%, #e6dfd7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 16px;
    }

    .sudoku-card {
      background: #fffaf4;
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 
        0 24px 40px -12px rgba(60, 45, 30, 0.35),
        inset 0 1px 4px rgba(255, 255, 255, 0.8);
      border: 1px solid #e7dcd0;
      max-width: 620px;
      width: 100%;
      transition: all 0.2s;
    }

    h1 {
      text-align: center;
      font-weight: 400;
      font-size: 2.1rem;
      letter-spacing: 6px;
      color: #4b3e33;
      margin-top: 0;
      margin-bottom: 0.8rem;
      text-shadow: 2px 2px 4px rgba(180, 150, 120, 0.15);
      word-break: keep-all;
    }

    /* 关卡选择按钮组 */
    .level-selector {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .level-btn {
      background: #ece3da;
      border: 1px solid #d9cec2;
      padding: 0.55rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      color: #4b3e33;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 2px 6px rgba(120, 90, 60, 0.08);
      letter-spacing: 0.5px;
    }

    .level-btn:hover {
      background: #dfd3c7;
      transform: translateY(-1px);
    }

    .level-btn.active {
      background: #c9b8a6;
      color: #2e2b28;
      font-weight: 700;
      border-color: #b7a58e;
      box-shadow: inset 0 2px 5px rgba(90, 70, 50, 0.2);
    }

    .sudoku-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 数独网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      background: #b7aa9b;
      border: 3px solid #b7aa9b;
      border-radius: 1.2rem;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 18px -6px rgba(80, 60, 40, 0.3);
    }

    .cell {
      background: #fdfaf7;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(5vw, 2.2rem);
      font-weight: 500;
      color: #2e2b28;
      border: 1px solid #d6cdc2;
      transition: background 0.1s, transform 0.05s;
      cursor: default;
      position: relative;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
    }

    /* 粗线：九宫格边界 */
    .cell:nth-child(3n) {
      border-right-width: 2.5px;
      border-right-color: #9b8b7a;
    }
    .cell:nth-child(9n) {
      border-right: none;
    }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom-width: 2.5px;
      border-bottom-color: #9b8b7a;
    }
    /* 移除最底行的加粗下边框 */
    .cell:nth-child(n+73):nth-child(-n+81) {
      border-bottom: none;
    }

    /* 预置数字样式 */
    .cell.given {
      color: #4a3a2e;
      font-weight: 700;
      background: #f6efe9;
    }

    /* 用户输入的数字 */
    .cell.user-filled {
      color: #1f5f8b;
      font-weight: 600;
      background: #eef6fe;
    }

    /* 高亮当前选中单元格 */
    .cell.selected {
      background: #f9eec1;
      box-shadow: inset 0 0 0 3px #f3c34f;
      z-index: 2;
    }

    /* 冲突数字 (错误) 样式 */
    .cell.conflict {
      background: #ffe1de;
      color: #c0392b;
      font-weight: 700;
    }

    /* 胜利状态 */
    .win-message {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 1.3rem;
      font-weight: 500;
      color: #3b6e4b;
      background: #e5f2e5;
      padding: 0.6rem 1.2rem;
      border-radius: 3rem;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      min-height: 3.2rem;
      width: 100%;
    }

    .win-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 控制按钮 */
    .actions {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 1.6rem;
      flex-wrap: wrap;
    }

    .btn {
      background: #ece3da;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #4b3e33;
      border-radius: 3rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(120, 90, 60, 0.15), inset 0 1px 2px #fff8f0;
      transition: all 0.15s;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d9cec2;
    }

    .btn:hover {
      background: #dfd3c7;
      transform: translateY(-1px);
      box-shadow: 0 8px 14px rgba(120, 90, 60, 0.2);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(120, 90, 60, 0.2);
      background: #d2c5b8;
    }

    .btn.reset-btn {
      background: #d9cfc4;
      color: #2e2b28;
      font-weight: 600;
    }

    /* 响应式调整 */
    @media (max-width: 480px) {
      .sudoku-card {
        padding: 1.2rem 1rem 1.5rem;
      }
      h1 {
        font-size: 1.6rem;
        letter-spacing: 4px;
        margin-bottom: 0.6rem;
      }
      .cell {
        font-size: 4.5vw;
      }
      .btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.95rem;
      }
      .win-message {
        font-size: 1rem;
      }
      .level-btn {
        padding: 0.4rem 1rem;
        font-size: 0.9rem;
      }
      .level-selector {
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="sudoku-card">
  <h1>数 独</h1>

  <!-- 关卡选择 -->
  <div class="level-selector">
    <button class="level-btn active" data-level="0">关卡 1</button>
    <button class="level-btn" data-level="1">关卡 2</button>
    <button class="level-btn" data-level="2">关卡 3</button>
  </div>

  <div class="sudoku-container">
    <div class="grid" id="sudoku-grid" role="grid" aria-label="数独棋盘"></div>
    <div class="win-message" id="winMessage">🎉 完美！你解开了数独 🎉</div>
    <div class="actions">
      <button class="btn reset-btn" id="resetBtn" type="button">↻ 重新开始</button>
    </div>
  </div>
</div>
<script>
  (function() {
    // ---------- 三个关卡谜题 (保证每关都有唯一解) ----------
    // 关卡1：经典中等难度
    const PUZZLE_1 = [
      [5, 3, 0, 0, 7, 0, 0, 0, 0],
      [6, 0, 0, 1, 9, 5, 0, 0, 0],
      [0, 9, 8, 0, 0, 0, 0, 6, 0],
      [8, 0, 0, 0, 6, 0, 0, 0, 3],
      [4, 0, 0, 8, 0, 3, 0, 0, 1],
      [7, 0, 0, 0, 2, 0, 0, 0, 6],
      [0, 6, 0, 0, 0, 0, 2, 8, 0],
      [0, 0, 0, 4, 1, 9, 0, 0, 5],
      [0, 0, 0, 0, 8, 0, 0, 7, 9]
    ];

    // 关卡2：另一中等难度 (有更多空格)
    const PUZZLE_2 = [
      [0, 0, 4, 3, 0, 0, 2, 0, 9],
      [0, 0, 5, 0, 0, 9, 0, 0, 1],
      [0, 7, 0, 0, 6, 0, 0, 4, 3],
      [0, 0, 6, 0, 0, 2, 0, 8, 7],
      [1, 9, 0, 0, 8, 7, 4, 0, 0],
      [0, 5, 0, 0, 0, 6, 0, 0, 2],
      [0, 0, 7, 9, 0, 1, 3, 0, 0],
      [6, 0, 0, 0, 0, 0, 1, 0, 0],
      [3, 0, 0, 0, 0, 4, 9, 7, 0]
    ];

    // 关卡3：较难 (空格较多，但仍然唯一解)
    const PUZZLE_3 = [
      [0, 0, 0, 2, 6, 0, 7, 0, 1],
      [6, 8, 0, 0, 7, 0, 0, 9, 0],
      [1, 9, 0, 0, 0, 4, 5, 0, 0],
      [8, 2, 0, 1, 0, 0, 0, 4, 0],
      [0, 0, 4, 6, 0, 2, 9, 0, 0],
      [0, 5, 0, 0, 0, 3, 0, 2, 8],
      [0, 0, 9, 3, 0, 0, 0, 7, 4],
      [0, 4, 0, 0, 5, 0, 0, 3, 6],
      [7, 0, 3, 0, 1, 8, 0, 0, 0]
    ];

    // 所有关卡数组
    const PUZZLES = [PUZZLE_1, PUZZLE_2, PUZZLE_3];

    // 当前关卡索引 (0,1,2)
    let currentLevel = 0;

    // 当前游戏状态 (二维数组)
    let board = [];
    // 标记哪些是初始给定的数字
    let givenMask = [];

    // 初始谜题 (用于重置当前关卡)
    let currentInitialBoard = [];

    // 当前选中单元格坐标
    let selectedCell = null;

    // DOM 元素
    const gridEl = document.getElementById('sudoku-grid');
    const winMessageEl = document.getElementById('winMessage');
    const resetBtn = document.getElementById('resetBtn');
    const levelBtns = document.querySelectorAll('.level-btn');

    // 每个单元格对应的 DOM 元素列表 (9x9)
    let cellElements = [];

    // ---------- 工具函数 ----------
    function isValidMove(row, col, num) {
      if (num === 0) return true;

      for (let c = 0; c < 9; c++) {
        if (c !== col && board[row][c] === num) return false;
      }
      for (let r = 0; r < 9; r++) {
        if (r !== row && board[r][col] === num) return false;
      }
      const boxRowStart = Math.floor(row / 3) * 3;
      const boxColStart = Math.floor(col / 3) * 3;
      for (let r = boxRowStart; r < boxRowStart + 3; r++) {
        for (let c = boxColStart; c < boxColStart + 3; c++) {
          if (r !== row && c !== col && board[r][c] === num) return false;
        }
      }
      return true;
    }

    function isBoardCompleteAndValid() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (board[r][c] === 0) return false;
        }
      }
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const val = board[r][c];
          if (val === 0) return false;
          if (!isValidMove(r, c, val)) return false;
        }
      }
      return true;
    }

    // 更新所有单元格样式和数字
    function updateAllCells() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = cellElements[r][c];
          const value = board[r][c];
          cell.textContent = value === 0 ? '' : value;

          cell.classList.remove('given', 'user-filled', 'conflict', 'selected');

          if (givenMask[r][c]) {
            cell.classList.add('given');
          } else if (value !== 0) {
            cell.classList.add('user-filled');
          }

          // 冲突检测 (只对非给定数字做冲突检测，因为给定数字若冲突则谜题本身有问题)
          if (value !== 0 && !givenMask[r][c]) {
            const temp = board[r][c];
            board[r][c] = 0;
            const conflict = !isValidMove(r, c, temp);
            board[r][c] = temp;
            if (conflict) {
              cell.classList.add('conflict');
            }
          }
          // 对于给定的数字，也检查冲突(理论上不会，但保留逻辑)
          if (value !== 0 && givenMask[r][c]) {
            const temp = board[r][c];
            board[r][c] = 0;
            const conflict = !isValidMove(r, c, temp);
            board[r][c] = temp;
            if (conflict) {
              cell.classList.add('conflict');
            }
          }
        }
      }

      // 重新高亮选中
      if (selectedCell) {
        const { row, col } = selectedCell;
        cellElements[row][col].classList.add('selected');
      }

      // 胜利判断
      if (isBoardCompleteAndValid()) {
        winMessageEl.classList.add('show');
      } else {
        winMessageEl.classList.remove('show');
      }
    }

    function refreshSelectedHighlight() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          cellElements[r][c].classList.remove('selected');
        }
      }
      if (selectedCell) {
        const { row, col } = selectedCell;
        cellElements[row][col].classList.add('selected');
      }
    }

    // 处理键盘输入
    function handleKeyDown(e) {
      if (!selectedCell) return;
      const { row, col } = selectedCell;

      if (givenMask[row][col]) return;

      const key = e.key;
      if (/^[1-9]$/.test(key)) {
        e.preventDefault();
        const num = parseInt(key, 10);
        board[row][col] = num;
        updateAllCells();
        refreshSelectedHighlight();
      } else if (key === '0' || key === 'Backspace' || key === 'Delete') {
        e.preventDefault();
        board[row][col] = 0;
        updateAllCells();
        refreshSelectedHighlight();
      }
    }

    // 点击单元格
    function handleCellClick(row, col, event) {
      event.stopPropagation();
      if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
        cellElements[row][col].classList.remove('selected');
        selectedCell = null;
      } else {
        if (selectedCell) {
          cellElements[selectedCell.row][selectedCell.col].classList.remove('selected');
        }
        selectedCell = { row, col };
        cellElements[row][col].classList.add('selected');
      }
    }

    // 构建网格
    function buildGrid() {
      gridEl.innerHTML = '';
      cellElements = [];

      for (let r = 0; r < 9; r++) {
        const rowCells = [];
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', (e) => handleCellClick(r, c, e));
          gridEl.appendChild(cell);
          rowCells.push(cell);
        }
        cellElements.push(rowCells);
      }
    }

    // 加载指定关卡 (level: 0,1,2)
    function loadLevel(level) {
      // 更新当前关卡索引
      currentLevel = level;

      // 获取对应谜题
      const puzzle = PUZZLES[level];
      // 深拷贝到 currentInitialBoard
      currentInitialBoard = puzzle.map(row => [...row]);

      // 初始化 board 和 givenMask
      board = puzzle.map(row => [...row]);
      givenMask = puzzle.map(row => row.map(val => val !== 0));

      // 清除选中
      if (selectedCell) {
        // 清除旧的高亮(如果存在)
        if (cellElements[selectedCell.row] && cellElements[selectedCell.row][selectedCell.col]) {
          cellElements[selectedCell.row][selectedCell.col].classList.remove('selected');
        }
        selectedCell = null;
      }

      // 更新所有单元格显示
      updateAllCells();

      // 更新关卡按钮的激活状态
      levelBtns.forEach((btn, idx) => {
        if (idx === level) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // 重置当前关卡
    function resetCurrentLevel() {
      // 从 currentInitialBoard 恢复
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          board[r][c] = currentInitialBoard[r][c];
          givenMask[r][c] = currentInitialBoard[r][c] !== 0;
        }
      }

      // 清除选中
      if (selectedCell) {
        if (cellElements[selectedCell.row] && cellElements[selectedCell.row][selectedCell.col]) {
          cellElements[selectedCell.row][selectedCell.col].classList.remove('selected');
        }
        selectedCell = null;
      }

      updateAllCells();
    }

    // ---------- 初始化 & 事件绑定 ----------
    function init() {
      // 构建网格 (此时 board 还没数据，但不要紧，之后 loadLevel 会填充)
      buildGrid();

      // 默认加载关卡1
      loadLevel(0);

      // 全局键盘监听
      window.addEventListener('keydown', handleKeyDown);

      // 重置按钮：重置当前关卡
      resetBtn.addEventListener('click', resetCurrentLevel);

      // 关卡按钮点击事件
      levelBtns.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          // 如果点击的是当前关卡，也可以重置或保持不变；这里选择加载（重置）该关卡
          if (currentLevel === idx) {
            // 如果已经是当前关卡，直接重置到初始状态
            resetCurrentLevel();
          } else {
            loadLevel(idx);
          }
        });
      });
    }

    // 启动
    init();
  })();
</script>
</body>
</html>
